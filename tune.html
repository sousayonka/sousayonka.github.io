<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴 크기 맞추기 ｜ 수사 4과</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="faces.css">
<style>
  body{padding:48px 0 80px}
  h1{font-family:var(--cond);font-weight:700;font-size:3rem;line-height:1}
  .guide{margin-top:14px;color:var(--sub);max-width:46em}
  .guide b{color:var(--yellow);font-weight:500}
  .row{display:grid;grid-template-columns:200px auto auto minmax(260px,1fr);gap:28px;align-items:start;padding:34px 0;border-bottom:1px solid var(--line)}
  .who b{display:block;font-size:1.2rem}
  .who small{font-family:var(--cond);letter-spacing:.2em;color:var(--muted)}
  .pv-label{display:block;margin-bottom:6px;font-family:var(--cond);font-size:.72rem;letter-spacing:.22em;color:var(--muted)}
  .cards{display:flex;gap:10px}
  .pv-card{position:relative;height:300px;border:1px solid var(--line-2);background:#111 no-repeat;overflow:hidden}
  .pv-card.wide{width:260px}.pv-card.narrow{width:80px}
  .pv-card{background-image:var(--img);background-size:auto var(--cz);background-position:var(--cx) var(--cy)}
  .pv-thumb{position:relative;width:120px;aspect-ratio:3/4;border:1px solid var(--yellow);background-image:var(--timg);background-repeat:no-repeat;background-size:auto var(--tz);background-position:var(--tx) var(--ty)}
  .guide-line{position:absolute;left:0;right:0;border-top:1px dashed rgba(227,191,69,.5);pointer-events:none}
  .ctrl{display:grid;gap:10px}
  .ctrl h4{font-family:var(--cond);font-size:.8rem;letter-spacing:.22em;color:var(--yellow);margin-top:6px}
  .ctrl label{display:grid;grid-template-columns:4.5em 1fr 3.5em;gap:10px;align-items:center;font-size:.84rem;color:var(--sub)}
  .ctrl output{font-family:var(--cond);font-weight:600;color:var(--text);text-align:right}
  .ctrl input{accent-color:var(--yellow)}
  .out{margin-top:46px}
  .out textarea{width:100%;height:190px;margin-top:12px;padding:14px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);font:13px/1.6 ui-monospace,Menlo,monospace}
  .out .btn{margin-top:14px;cursor:pointer;font:inherit}
  .done{margin-left:14px;color:var(--yellow);opacity:0;transition:opacity .3s}
  .done.show{opacity:1}
  @media (max-width:900px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <h1>FACE TUNING</h1>
  <p class="guide">캐릭터마다 그림 속 얼굴 크기가 달라서, 여기서 하나씩 맞춰 주세요. 점선 두 줄 사이에 <b>눈이 오도록</b> 맞추면 모두 비슷한 크기로 보여요. 다 맞추면 아래 <b>복사하기</b>를 눌러 <b>faces.css</b> 파일 내용을 통째로 바꾸면 끝이에요.</p>

  <div id="rows"></div>

  <section class="out">
    <h4 class="pv-label">FACES.CSS 에 붙여 넣을 내용</h4>
    <textarea id="code" readonly aria-label="faces.css 내용"></textarea>
    <button class="btn primary" type="button" id="copy">복사하기</button><span class="done" id="done">복사됐어요</span>
  </section>
</main>

<script>
(function () {
  var people = [
    { id: 'arima',  ko: '아리마 소이치로', en: 'ARIMA',  card: 'https://i.imgur.com/eVPmDS0.png', thumb: 'https://i.imgur.com/agVr4YO.png' },
    { id: 'hayato', ko: '아카바네 하야토', en: 'HAYATO', card: 'https://i.imgur.com/hTiQClF.png', thumb: 'https://i.imgur.com/ChLbR9o.png' },
    { id: 'renji',  ko: '하야미 렌지',     en: 'RENJI',  card: 'https://i.imgur.com/YAdehYs.png', thumb: 'https://i.imgur.com/8L87IQa.png' },
    { id: 'itsuki', ko: '텐도 이츠키',     en: 'ITSUKI', card: 'https://i.imgur.com/zacmJ2r.png', thumb: 'https://i.imgur.com/JcWxi3h.png' },
    { id: 'sakuma', ko: '사쿠마 류헤이',   en: 'SAKUMA', card: 'https://i.imgur.com/d9tq0cH.png', thumb: 'https://i.imgur.com/YbM63P8.png' }
  ];
  var keys = [
    ['cz', '확대', 60, 400, '%'], ['cx', '가로', 0, 100, '%'], ['cy', '세로', 0, 100, '%'],
    ['tz', '확대', 60, 400, '%'], ['tx', '가로', 0, 100, '%'], ['ty', '세로', 0, 100, '%']
  ];
  var rows = document.getElementById('rows');
  var code = document.getElementById('code');
  var state = {};

  // 지금 faces.css 에 저장된 값을 읽어 와서 시작값으로 쓴다
  people.forEach(function (p) {
    var probe = document.createElement('div');
    probe.setAttribute('data-face', p.id);
    probe.hidden = true;
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    state[p.id] = {};
    keys.forEach(function (k) {
      var v = parseFloat(cs.getPropertyValue('--' + k[0]));
      state[p.id][k[0]] = isNaN(v) ? (k[0].slice(1) === 'z' ? 120 : 50) : v;
    });
    probe.remove();
  });

  function slider(p, k) {
    return '<label>' + k[1] + '<input type="range" min="' + k[2] + '" max="' + k[3] + '" step="1" value="' + state[p.id][k[0]] +
      '" data-p="' + p.id + '" data-k="' + k[0] + '"><output>' + state[p.id][k[0]] + '%</output></label>';
  }
  var lines = '<i class="guide-line" style="top:16%"></i><i class="guide-line" style="top:24%"></i>';
  rows.innerHTML = people.map(function (p) {
    return '<div class="row" id="r-' + p.id + '" style="--img:url(' + p.card + ');--timg:url(' + p.thumb + ')">' +
      '<div class="who"><b>' + p.ko + '</b><small>' + p.en + '</small></div>' +
      '<div><span class="pv-label">명부 카드 (넓을 때 / 좁을 때)</span><div class="cards"><div class="pv-card wide">' + lines + '</div><div class="pv-card narrow">' + lines + '</div></div></div>' +
      '<div><span class="pv-label">썸네일 · 신분증</span><div class="pv-thumb">' + lines + '</div></div>' +
      '<div class="ctrl"><h4>명부 카드</h4>' + keys.slice(0, 3).map(function (k) { return slider(p, k); }).join('') +
      '<h4>썸네일 · 신분증</h4>' + keys.slice(3).map(function (k) { return slider(p, k); }).join('') + '</div></div>';
  }).join('');

  function apply() {
    var css = '/* ════════ 캐릭터 얼굴 크기 · 위치 ════════\n   tune.html 에서 맞춘 값입니다. */\n';
    people.forEach(function (p) {
      var s = state[p.id], row = document.getElementById('r-' + p.id);
      keys.forEach(function (k) { row.style.setProperty('--' + k[0], s[k[0]] + '%'); });
      css += '[data-face="' + p.id + '"]{' + keys.map(function (k) { return '--' + k[0] + ':' + s[k[0]] + '%'; }).join(';') + '}\n';
    });
    code.value = css;
  }
  rows.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.dataset.p) return;
    state[t.dataset.p][t.dataset.k] = +t.value;
    t.nextElementSibling.textContent = t.value + '%';
    apply();
  });
  document.getElementById('copy').addEventListener('click', function () {
    code.select();
    var ok = function () { var d = document.getElementById('done'); d.classList.add('show'); setTimeout(function () { d.classList.remove('show'); }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(code.value).then(ok, function () { document.execCommand('copy'); ok(); });
    else { document.execCommand('copy'); ok(); }
  });
  apply();
})();
</script>
</body>
</html>
